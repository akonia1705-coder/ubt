<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11-сынып Информатика тесті (50 сұрақ)</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .quiz-card { background: #ffffff; width: 100%; max-width: 750px; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #eef0f3; padding-bottom: 15px; }
        .header h1 { color: #1a73e8; margin: 0 0 10px 0; font-size: 24px; }
        .progress-bar { font-weight: 600; color: #5f6368; font-size: 14px; }
        .user-info { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        .user-info input { padding: 12px; border: 1px solid #dadce0; border-radius: 6px; font-size: 16px; outline: none; }
        .start-btn { background: #1a73e8; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: background 0.2s; }
        .start-btn:hover { background: #1557b0; }
        .question { font-weight: 600; font-size: 18px; color: #202124; margin-bottom: 20px; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { width: 100%; padding: 14px; border: 1px solid #dadce0; border-radius: 8px; background: #fff; cursor: pointer; text-align: left; font-size: 15px; color: #3c4043; transition: all 0.2s; }
        .option-btn:hover { background-color: #f8f9fa; border-color: #c1c4c9; }
        .correct { background-color: #e6f4ea !important; color: #137333 !important; border-color: #34a853 !important; font-weight: bold; }
        .wrong { background-color: #fce8e6 !important; color: #c5221f !important; border-color: #ea4335 !important; }
        .next-btn { margin-top: 25px; width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; display: none; }
        .next-btn:hover { background: #2980b9; }
        .result-box { text-align: center; display: none; }
        .result-score { font-size: 48px; color: #1a73e8; font-weight: bold; margin: 15px 0; }
        .result-details { font-size: 18px; color: #3c4043; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="quiz-card">
    <div class="header">
        <h1>11-сынып: Информатика тесті</h1>
        <div class="progress-bar" id="progress-text">Оқушы мәліметін енгізіңіз</div>
    </div>

    <!-- 1. Тіркелу блогы -->
    <div id="start-screen">
        <div class="user-info">
            <input type="text" id="student-name" placeholder="Оқушының аты-жөні" required>
            <input type="text" id="student-class" placeholder="Сыныбы (мысалы: 11 «А»)" required>
            <button class="start-btn" onclick="startQuiz()">Тестті бастау</button>
        </div>
    </div>

    <!-- 2. Сұрақтар блогы -->
    <div id="quiz-screen" style="display: none;">
        <div class="question" id="question-text">Сұрақ жүктелуде...</div>
        <div class="options" id="options-container"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Келесі сұрақ</button>
    </div>

    <!-- 3. Нәтиже блогы -->
    <div id="result-screen" class="result-box">
        <h2>Тест аяқталды!</h2>
        <div class="result-score" id="result-percent">0%</div>
        <div class="result-details" id="result-text"></div>
        <button class="start-btn" onclick="location.reload()">Қайта тапсыру</button>
    </div>
</div>

<script>
    // 50 СҰРАҚТАН ТҰРАТЫН ІШКІ БАЗА
    const questions = [
        { q: "1. Реляциялық деректер базасы дегеніміз не?", options: ["A) Иерархиялық ағаш құрылымы", "B) Екіөлшемді кестелер жиынтығы", "C) Желілік байланыстар жиыны", "D) Граф түріндегі деректер"], correct: 1 },
        { q: "2. Деректер базасындағы кестенің бағаны қалай аталады?", options: ["A) Жазба (Record)", "B) Жол (Row)", "C) Өріс (Field)", "D) Индекс (Index)"], correct: 2 },
        { q: "3. Кестенің әрбір жазбасын бірегей түрде анықтайтын өріс:", options: ["A) Сыртқы кілт (Foreign Key)", "B) Бастапқы кілт (Primary Key)", "C) Индекс", "D) Составной ключ"], correct: 1 },
        { q: "4. SQL тілінде кестеден деректерді таңдап алу командасы:", options: ["A) UPDATE", "B) INSERT", "C) SELECT", "D) DELETE"], correct: 2 },
        { q: "5. SQL-де шарт бойынша деректерді сүзгілеу үшін қай оператор қолданылады?", options: ["A) WHERE", "B) ORDER BY", "C) GROUP BY", "D) HAVING"], correct: 0 },
        { q: "6. Python тілінде тізімді (List) анықтау үшін қай жақша қолданылады?", options: ["A) { }", "B) ( )", "C) [ ]", "D) < >"], correct: 2 },
        { q: "7. Python-да өзгермейтін (immutable) деректер түрі кайсысы?", options: ["A) List", "B) Dictionary", "C) Set", "D) Tuple"], correct: 3 },
        { q: "8. Python-да тізімнің соңына жаңа элемент қосатын әдіс:", options: ["A) insert()", "B) append()", "C) add()", "D) extend()"], correct: 1 },
        { q: "9. Алгоритмнің орындалу уақытының күрделілігін белгілейтін нотация:", options: ["A) Big O", "B) Big Alpha", "C) O-Min", "D) Algo-Check"], correct: 0 },
        { q: "10. Сұрыптау алгоритмдерінің ішіндегі ең қарапайым әрі орташа күрделілігі O(n²) болатын түрі:", options: ["A) Быстрый сорт (Quick sort)", "B) Сортировка слиянием (Merge sort)", "C) Пузырьковая сортировка (Bubble sort)", "D) Пирамидальная сортировка"], correct: 2 },
        { q: "11. HTML дегеніміз не?", options: ["A) Бағдарламалау тілі", "B) Гипермәтіндік белгілеу тілі", "C) Деректер базасы", "D) Операциялық жүйе"], correct: 1 },
        { q: "12. CSS қызметі қандай?", options: ["A) Веб-беттің стилі мен безендірілуін сипаттау", "B) Серверлік логиканы жазу", "C) Деректерді сақтау", "D) Домендік атауды басқару"], correct: 0 },
        { q: "13. JavaScript тілі не үшін қолданылады?", options: ["A) Кестелерді құру үшін", "B) Веб-бетке интерактивтілік пен динамика қосу үшін", "C) Тек мәтін жазу үшін", "D) Серверді қайта жүктеу үшін"], correct: 1 },
        { q: "14. IP-мекенжайдың IPv4 стандарты неше биттен тұрады?", options: ["A) 16 бит", "B) 32 бит", "C) 64 бит", "D) 128 бит"], correct: 1 },
        { q: "15. IPv6 стандартының разрядтылығы қанша?", options: ["A) 32 бит", "B) 64 бит", "C) 128 бит", "D) 256 бит"], correct: 2 },
        { q: "16. Домендік атауларды IP-мекенжайларға түрлендіретін қызмет:", options: ["A) DHCP", "B) DNS", "C) FTP", "D) HTTP"], correct: 1 },
        { q: "17. Компьютерлік желілердегі TCP/IP моделі неше деңгейден тұрады?", options: ["A) 3", "B) 4", "C) 7", "D) 5"], correct: 1 },
        { q: "18. OSI моделі неше деңгейге бөлінеді?", options: ["A) 4", "B) 5", "C) 6", "D) 7"], correct: 3 },
        { q: "19. Ақпаратты шифрлау және дешифрлау ғылымы қалай аталады?", options: ["A) Стеганография", "B) Криптография", "C) Топология", "D) Аналитика"], correct: 1 },
        { q: "20. Асимметриялы шифрлауда қандай кілттер қолданылады?", options: ["A) Тек бір құпия кілт", "B) Ашық және жабық кілттер (Public & Private keys)", "C) Сессиялық кілт", "D) Кілт қолданылмайды"], correct: 1 },
        { q: "21. Цифрлық қолтаңбаның (ЭЦП) басты мақсаты не?", options: ["A) Файлдың көлемін кішірейту", "B) Кұжаттың төпнұсқалығын және авторлығын растау", "C) Компьютерді вирустан қорғау", "D) Интернет жылдамдығын арттыру"], correct: 1 },
        { q: "22. Жасанды интеллект саласындағы ML аббревиатурасының мағынасы:", options: ["A) Main Language", "B) Machine Learning (Машиналық оқыту)", "C) Mobile Logic", "D) Master Level"], correct: 1 },
        { q: "23. Адам миының жұмысын имитациялайтын математикалық модель:", options: ["A) Нейрондық желілер (Neural Networks)", "B) Генетикалық алгоритмдер", "C) Шифрлау алгоритмдері", "D) Деректер ағашы"], correct: 0 },
        { q: "24. Үлкен деректерді (Big Data) сипаттайтын «3V» концепциясы:", options: ["A) Volume, Velocity, Variety", "B) Value, Virtual, Visual", "C) Vector, Variable, Version", "D) View, Verification, Validity"], correct: 0 },
        { q: "25. Заттар интернеті (IoT) дегеніміз не?", options: ["A) Әлеуметтік желілер жиынтығы", "B) Интернетке қосылған және өзара дерек алмасатын физикалық құрылғылар желісі", "C) Онлайн дүкендер жүйесі", "D) Компьютерлік ойындар сервері"], correct: 1 },
        { q: "26. Бұлтты технологиялардың (Cloud Computing) SaaS моделі:", options: ["A) Infrastructure as a Service", "B) Platform as a Service", "C) Software as a Service (Бағдарламалық қамтамасыз ету қызмет ретінде)", "D) Storage as a Service"], correct: 2 },
        { q: "27. Python-да шартты тексеру операторы кайсысы?", options: ["A) for", "B) while", "C) if", "D) def"], correct: 2 },
        { q: "28. Python-да функцияларды анықтау үшін қай түйінді сөз қолданылады?", options: ["A) function", "B) def", "C) func", "D) create"], correct: 1 },
        { q: "29. 1 Байтта неше Бит бар?", options: ["A) 2", "B) 8", "C) 1024", "D) 16"], correct: 1 },
        { q: "30. Ақпараттық қауіпсіздіктің үш негізгі принципі (CIA):", options: ["A) Құпиялылық, Тұтастық, Қолжетімділік", "B) Жылдамдық, Сенімділік, Арзандық", "C) Шифрлау, Бұғаттау, Жою", "D) Толықтық, Нақтылық, Өзектілік"], correct: 0 },
        { q: "31. Фишинг (Phishing) шабуылының мақсаты не?", options: ["A) Желілік жабдықтарды істен шығару", "B) Пайдаланушының құпия деректерін (пароль, карта) алдап алу", "C) Компьютерге вирус тарату", "D) Спам хабарламалар бұғаттау"], correct: 1 },
        { q: "32. Серверге шамадан тыс сұраныс жіберіп, оны істен шығару шабуылы:", options: ["A) DDoS шабуыл", "B) Brute Force", "C) SQL Injection", "D) Cross-Site Scripting"], correct: 0 },
        { q: "33. SQL-де жаңа жазба қосу командасы:", options: ["A) ADD", "B) INSERT INTO", "C) CREATE ROW", "D) PUSH"], correct: 1 },
        { q: "34. SQL-де бар жазбаларды өзгерту командасы:", options: ["A) CHANGE", "B) MODIFY", "C) UPDATE", "D) EDIT"], correct: 2 },
        { q: "35. Python-да экранға мәлімет шығару функциясы:", options: ["A) echo()", "B) print()", "C) write()", "D) output()"], correct: 1 },
        { q: "36. Python-да пернетақтадан мәлімет енгізу функциясы:", options: ["A) scan()", "B) read()", "C) input()", "D) get()"], correct: 2 },
        { q: "37. Стек (Stack) деректер құрылымы қандай принциппен жұмыс істейді?", options: ["A) FIFO (First In First Out)", "B) LIFO (Last In First Out)", "C) Random Access", "D) Priority Queue"], correct: 1 },
        { q: "38. Кезектің (Queue) жұмыс істеу принципі:", options: ["A) LIFO", "B) FIFO (First In First Out)", "C) FILO", "D) Direct Access"], correct: 1 },
        { q: "39. HTML-де ең үлкен тақырып стандарты қай тегпен беріледі?", options: ["A) <h6>", "B) <head>", "C) <h1>", "D) <header>"], correct: 2 },
        { q: "40. Веб-беттегі гиперсілтеме жасау тегі:", options: ["A) <link>", "B) <a>", "C) <href>", "D) <url>"], correct: 1 },
        { q: "41. Сурет қосуға арналған HTML тегі:", options: ["A) <picture>", "B) <img src='...'>", "C) <image>", "D) <media>"], correct: 1 },
        { q: "42. Пиксель дегеніміз не?", options: ["A) Растрлық кескіннің ең кіші элементі", "B) Векторлық графика формуласы", "C) Дыбыс жиілігінің бірлігі", "D) Желі жылдамдығы"], correct: 0 },
        { q: "43. RGB түстік моделінің негізгі түстері:", options: ["A) Қызыл, Жасыл, Көк (Red, Green, Blue)", "B) Сары, Қара, Ақ", "C) Циан, Маджента, Сары", "D) Қара-ақ спектр"], correct: 0 },
        { q: "44. Компьютерлік графиканың қай түрі масштаблағанда сапасын жоғалтпайды?", options: ["A) Растрлық", "B) Векторлық", "C) Трехмерная (3D)", "D) Пиксельдік"], correct: 1 },
        { q: "45. Компьютердің сыртқы жадына не жатады?", options: ["A) ОЗУ (RAM)", "B) Кэш-жад", "C) Регистрлер", "D) SSD / Қатқыл диск (HDD)"], correct: 3 },
        { q: "46. Жедел жадтың (RAM) басты ерекшелігі:", options: ["A) Тоқ өшкенде мәлімет сақталмайды (энергияға тәуелді)", "B) Мәліметті мәңгі сақтайды", "C) Тек оқуға арналған", "D) Өте баяу жұмыс істейді"], correct: 0 },
        { q: "47. Компьютерлік желідегі «Топология» деген не?", options: ["A) Желі жылдамдығы", "B) Компьютерлердің өзара физикалық немесе логикалық орналасу схемасы", "C) Кабель түрі", "D) Сервердің қуаты"], correct: 1 },
        { q: "48. «Жұлдызша» (Star) топологиясының басты артықшылығы:", options: ["A) Орталық хаб/свитч істен шықса желі жұмыс істей береді", "B) Бір компьютер бұзылса, қалғандары жұмысын жалғастыра береді", "C) Кабель өте аз кетеді", "D) Терминатор қолданылады"], correct: 1 },
        { q: "49. Сұрыптау алгоритмінің тұрақтылығы (Stability) нені білдіреді?", options: ["A) Жадты мүлдем жұмсамауын", "B) Бірдей кілттері бар элементтердің бастапқы ретінің сақталуын", "C) Алгоритмнің тоқтамауын", "D) Тек санға жұмыс істеуін"], correct: 1 },
        { q: "50. Python-да екі айнымалының мәнін салыстыру (теңдік) операторы:", options: ["A) =", "B) ==", "C) IS", "D) EQUAL"], correct: 1 }
    ];

    let currentQ = 0;
    let score = 0;
    let studentName = "";
    let studentClass = "";

    function startQuiz() {
        studentName = document.getElementById("student-name").value.trim();
        studentClass = document.getElementById("student-class").value.trim();

        if (!studentName || !studentClass) {
            alert("Өтініш, аты-жөніңіз бен сыныбыңызды толық енгізіңіз!");
            return;
        }

        document.getElementById("start-screen").style.display = "none";
        document.getElementById("quiz-screen").style.display = "block";
        loadQuestion();
    }

    function loadQuestion() {
        const qData = questions[currentQ];
        document.getElementById("progress-text").innerText = `Сұрақ ${currentQ + 1} / ${questions.length}`;
        document.getElementById("question-text").innerText = qData.q;
        
        const optionsBox = document.getElementById("options-container");
        optionsBox.innerHTML = "";
        document.getElementById("next-btn").style.display = "none";

        qData.options.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => selectOption(btn, idx, qData.correct);
            optionsBox.appendChild(btn);
        });
    }

    function selectOption(btn, selectedIdx, correctIdx) {
        const allBtns = document.querySelectorAll(".option-btn");
        allBtns.forEach(b => b.disabled = true);

        if (selectedIdx === correctIdx) {
            btn.classList.add("correct");
            score++;
        } else {
            btn.classList.add("wrong");
            allBtns[correctIdx].classList.add("correct");
        }

        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        currentQ++;
        if (currentQ < questions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "block";
        document.getElementById("progress-text").innerText = "Тест аяқталды";

        const percent = Math.round((score / questions.length) * 100);
        document.getElementById("result-percent").innerText = `${percent}%`;
        document.getElementById("result-text").innerHTML = `
            <strong>Оқушы:</strong> ${studentName} (${studentClass})<br><br>
            <strong>Нәтиже:</strong> 50 сұрақтың <strong>${score}</strong>-сіне дұрыс жауап берілді.
        `;
    }
</script>

</body>
</html>
